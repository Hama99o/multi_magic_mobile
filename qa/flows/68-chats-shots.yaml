# Readiness pictures, Chats: the list (and the first thread, when there is one)
# at ${SHOT} (360, 411, 800, 411-dark, 411-font200), a relaunch per setting.
#
# COVERS: arriving; the shots are for a person.
# CANNOT TELL YOU: anything a screenshot is not read for.
appId: ${APP_ID}
tags: [chats, readiness, shots]
---
- runFlow: login.yaml
- tapOn:
    id: "chat-close"
- scrollUntilVisible:
    element:
      id: "home-tile-chats"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "home-tile-chats"
- extendedWaitUntil:
    visible:
      id: "chats-list"
    timeout: 30000
- takeScreenshot: reports/68-chats-list-${SHOT}
- runFlow:
    when:
      notVisible:
        id: "chats-empty"
    commands:
      # lint: dbid-ok — any thread is the subject; the QA account's own list
      - tapOn:
          id: "chat-row-.*"
          index: 0
      # Wait for the thread itself: a shot straight after the tap caught the
      # list (411, 800) or the push mid-animation (411 dark), 2026-11-25.
      - extendedWaitUntil:
          visible:
            id: "people-composer-input"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: reports/68-chats-thread-${SHOT}
