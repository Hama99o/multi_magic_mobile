# NOTES, the read view (phase 2, 2026-11-12): the Home tile, the list
# (pinned first, then last edited), and a note drawn natively from the web's
# stored HTML. docs/design/notes/SPEC.md.
#
# Reads the QA account's 23 "[qa-notes]" notes: 20 real dev notes chosen to
# cover every node and mark, plus emoji/sub/sup, a 2.3.1 image uploader and a
# Pashto note. Legacy <img>/<iframe>, tables and code show as "view on web"
# cards; nothing is dropped.
#
# It writes nothing.
#
# ── FLOW_REGISTER note ─────────────────────────────────────────────────────
# COVERS: the door (Home tile); the list and its pinned section; opening a
# note; every renderer on real content; the legacy cards; RTL per block; a
# 914 KB note opening.
# CANNOT TELL YOU: the colours of a highlight by eye (shots are looked at);
# editing (flow 27). No web link exists in Notes (owner, 2026-11-13).
appId: ${APP_ID}
tags:
  - notes
---
- runFlow: login.yaml
- tapOn:
    id: "chat-close"
- tapOn:
    id: "home-tile-notes"
- extendedWaitUntil:
    visible:
      id: "notes-list"
    timeout: 30000
- assertVisible: "\\[qa-notes\\] 01.*"
- takeScreenshot: reports/26-notes-list

# 02: table, quote, rule
- scrollUntilVisible:
    element: "\\[qa-notes\\] 02.*"
    direction: DOWN
    timeout: 60000
- tapOn: "\\[qa-notes\\] 02.*"
- extendedWaitUntil:
    visible:
      id: "note-body"
    timeout: 60000
- assertNotVisible:
    id: "note-load-failed"
- takeScreenshot: reports/26-notes-02
- scroll
- takeScreenshot: reports/26-notes-02-b
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "notes-list"
    timeout: 15000

