# PEOPLE CHAT — and the one assertion here that no unit test in this repo can make.
#
# `docs/design/people-chat/SPEC.md` §0.2: the server broadcasts every message
# TWICE, and the ConversationChannel copy is rendered with `user: nil`, so
# `sent_by_me` is false for everybody on that stream — the sender included. A
# thread fed from it draws every message on the LEFT. Every unit test in this
# repo mocks the cable, so not one of them can catch that; only a device with a
# live socket can. Hence `msg-mine-*` / `msg-theirs-*` in the handles: the side
# a message lands on is the assertion, not a detail of it.
#
# ── FLOW_REGISTER note — lift verbatim into the "Notes" column ──────────────
# COVERS: the chat list renders rows from `GET /conversations` with a name
# (which comes from `user.fullname`, NOT the null `title` of a direct chat) and
# an unread badge; opening a thread fires `mark_read` and the badge clears on
# return; a message SENDS over HTTP and appears on the RIGHT — the `sent_by_me`
# trap above; the long-press sheet opens with six emoji and the action menu;
# a reaction chip appears under the bubble and the same emoji again removes it
# (the endpoint is a toggle, `routes.rb:295`).
#
# CANNOT TELL YOU:
#  · (RESOLVED 2026-09-18) It now REACHES the screen by tapping the real
#    `chat-open-chats` icon rather than by deep link, so a PASS does say a user
#    can get there. Two reasons the tap is better than the link and both were
#    measured: a deep link COLD-RESTARTS the Expo experience, so each one cost
#    ~30 s and a splash screen; and a route nobody can reach is exactly the gap
#    a deep link hides.
#  · **Whether an incoming message from ANOTHER PERSON renders on the left,**
#    which is the half of the `sent_by_me` trap that matters most. That needs a
#    second signed-in account and the rig has NONE. The left side is asserted
#    only if the QA account's history already contains somebody else's message,
#    which is luck, not coverage.
#  · **Whether the double tick is correct.** `read_at` is nil unless EVERY other
#    member has read past it, so a one-account run can never make it non-nil.
#  · **Whether the UNREAD divider is placed right**, which needs a thread that
#    is genuinely unread on arrival — i.e. a second account to send into it.
#  · Anything about groups. The QA account has no group thread.
appId: ${APP_ID}
tags:
  - people
---
- runFlow: login.yaml

# The real door, not a deep link — so this flow proves the screen is reachable
# as well as correct. `chat-open-chats` is the first of the four title-bar icons.
- tapOn:
    id: "chat-open-chats"
- extendedWaitUntil:
    visible:
      id: "chats-list"
    timeout: 60000
- takeScreenshot: reports/06-chats-list

# An empty list is a legitimate state and NOT a failure: the app cannot start a
# conversation (no people picker in v1), so a fresh QA account has none. The run
# stops here rather than asserting into an empty screen — and says so.
- runFlow:
    when:
      visible:
        id: "chats-empty"
    commands:
      - takeScreenshot: reports/06-chats-empty-no-threads
      # NOT a pass and NOT a failure: nothing was measured past this point.
      # Seed a thread from the web as the QA account, then re-run.
      - assertVisible: "Chats you start on MultiMagic appear here."

- runFlow:
    when:
      notVisible:
        id: "chats-empty"
    commands:
      # ── The thread ──────────────────────────────────────────────────────
      # lint: dbid-ok — ANY thread is the subject here. The rig cannot know
      # the QA account's thread names, and `chat-row-<id>` is the only handle
      # on the row; the assertions that follow are about the thread it opened,
      # not about which one it was.
      - tapOn:
          id: "chat-row-.*"
      - extendedWaitUntil:
          visible:
            id: "thread-list"
          timeout: 30000
      - assertVisible:
          id: "thread-title"
      - takeScreenshot: reports/07-thread-open

      # ── SEND, and land on the RIGHT ─────────────────────────────────────
      # This is the assertion the file exists for.
      - tapOn:
          id: "people-composer-input"
      # Labelled, because this WRITES INTO A REAL CONVERSATION on his real
      # MultiMagic — the QA account's own, never his (RIG_CONTRACT §3). A run
      # that leaves anonymous text in a thread is indistinguishable from a
      # person having sent it.
      - inputText: "[qa] automated test message"
      # NO `hideKeyboard`. Two reasons, both measured in this repo: after
      # `inputText` the send button asserts visible and after `hideKeyboard` it
      # does not (`01-ask`); and this is a PUSHED screen, so a Back that reaches
      # the app pops the thread and the next step fails on the chat list. The
      # people composer is `multiline`, so Enter would insert a newline rather
      # than send. The screen is `avoidKeyboard`, so the button is on screen.
      - tapOn:
          id: "people-composer-send"
      # `msg-mine-*` — if the ConversationChannel copy were feeding this
      # screen, the message would render as `msg-theirs-*` and this fails.
      # lint: dbid-ok — the PREFIX is the assertion. `msg-mine-` vs
      # `msg-theirs-` is which side the message landed on, which is the whole
      # point of this flow; the id after it is the message's and cannot be
      # known in advance.
      - extendedWaitUntil:
          visible:
            id: "msg-mine-.*"
          timeout: 30000
      - takeScreenshot: reports/08-thread-sent-right-side

      # ── React, and take it back ─────────────────────────────────────────
      # lint: dbid-ok — same handle, same reason: the side is the assertion.
      - longPressOn:
          id: "msg-mine-.*"
      - assertVisible:
          id: "reaction-sheet"
      - takeScreenshot: reports/09-reaction-sheet
      - tapOn:
          id: "reaction-thumbs-up"
      - extendedWaitUntil:
          notVisible:
            id: "reaction-sheet"
          timeout: 10000
      - assertVisible: "👍"
      - takeScreenshot: reports/10-reaction-chip

      # The toggle: the same emoji again removes it. One endpoint, no separate
      # remove — and if a DELETE ever appears in the client, this fails.
      # lint: dbid-ok — same handle, same reason.
      - longPressOn:
          id: "msg-mine-.*"
      - tapOn:
          id: "reaction-thumbs-up"
      - extendedWaitUntil:
          notVisible: "👍"
          timeout: 15000
      - takeScreenshot: reports/11-reaction-removed

      # ── THE SEPARATION GATE, as evidence rather than as prose ───────────
      # `docs/design/people-chat/SPEC.md` §2.4 — his instruction: the two
      # threads must not be mistakable. These two screenshots are the pair
      # that gets assembled side by side; if they could be confused at a
      # glance, row 12 is not DONE. No assertion can judge that — a person
      # looks at the pair. That is the point.
      - takeScreenshot: reports/12-separation-people-thread
      - back
      - back
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 30000
      - takeScreenshot: reports/13-separation-assistant-thread
