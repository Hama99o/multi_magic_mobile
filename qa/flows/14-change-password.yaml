# CHANGE PASSWORD — and a wrong current password must NOT sign you out.
#
# `docs/design/profile/SPEC.md` §2.2-2.3. The server answers a wrong current
# password with **422, not 401**, and says why in its own comment: *"a typo in
# the current password is a validation failure. The client treats every 401 as
# an expired session and signs the user out."* This client does exactly that,
# so the one thing this screen must never do is turn a typo into a sign-out.
# That is the assertion: after the refusal, the field is still here, the sign-in
# screen is not, and Back lands on the assistant.
#
# ── WHY THE PASSWORD IS NEVER ACTUALLY CHANGED ───────────────────────────
# Changing the QA account's password mid-suite strands every later flow on a
# stale `.env` — and if the change-back failed, the whole rig would be locked
# out until a human intervened. The success path (the message, the fields
# clearing) is unit-tested; here the current password typed is WRONG on purpose,
# so nothing on the server changes.
#
# ── ONE RULE, BECAUSE THERE IS ONLY ONE ──────────────────────────────────
# `devise.rb:185` is `password_length = 6..128`. The screen states that and
# nothing else; five invented rules would reject passwords the server accepts.
appId: ${APP_ID}
tags:
  - account
---
- runFlow: login.yaml
- tapOn:
    id: "chat-open-sessions"
- tapOn:
    id: "sessions-profile"
- extendedWaitUntil:
    visible:
      id: "profile-firstname"
    timeout: 30000
# The row belongs to the profile and is not part of the form (TheFork's
# placement); it may sit below the fold on a phone.
- scrollUntilVisible:
    element:
      id: "profile-password"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "profile-password"
- extendedWaitUntil:
    visible:
      id: "password-current"
    timeout: 30000
- assertVisible: "Change password"
- assertVisible:
    id: "password-new"
- assertVisible:
    id: "password-confirm"
# The one real rule, stated once.
- assertVisible: "At least 6 characters."
- takeScreenshot: reports/76-change-password-empty

# ── The confirmation catches the typo you cannot see ─────────────────────
- tapOn:
    id: "password-new"
- inputText: "rig-new-secret-1"
- tapOn:
    id: "password-confirm"
- inputText: "rig-new-secret-2"
# Enter on a single-line field performs the IME's done and closes the keyboard;
# not hideKeyboard, whose Back could pop this pushed screen.
- pressKey: Enter
- assertVisible: "These do not match."
- takeScreenshot: reports/77-change-password-mismatch

# Reveal: five of six references have it, and it is the only defence against a
# typo you cannot see. After the tap the plain text is in the tree.
- tapOn:
    id: "password-new-reveal"
- assertVisible: "rig-new-secret-1"

# Fixed, and the message goes.
- tapOn:
    id: "password-confirm"
- eraseText: 40
- inputText: "rig-new-secret-1"
# Same reasoning: Enter, not hideKeyboard.
- pressKey: Enter
- assertNotVisible: "These do not match."

# ── The wrong current password: 422, against the field, still signed in ──
- tapOn:
    id: "password-current"
- inputText: "definitely-not-the-qa-password"
# Same reasoning: Enter, not hideKeyboard.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "password-save"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "password-save"
- extendedWaitUntil:
    visible:
      id: "password-wrong-current"
    timeout: 30000
- assertVisible: "That password is not right."
- takeScreenshot: reports/78-change-password-wrong-current

# THE ASSERTION. The session is untouched: this screen is still here, the
# sign-in screen is not, and Back lands on the assistant rather than on a login.
- assertVisible:
    id: "password-current"
- assertNotVisible:
    id: "sign-in-email"
- assertNotVisible:
    id: "password-done"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "profile-firstname"
    timeout: 20000
- tapOn: "Back"
- assertVisible:
    id: "composer-input"
