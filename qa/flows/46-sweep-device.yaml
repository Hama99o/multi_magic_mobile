# THE HIDDEN-CRITERIA SWEEP ON A DEVICE (Hello, 2026-11-21), ff's apps.
#
# 1. Flow's board at a 200 % system font (fix 025020e). Jest proved the tile
#    asks for the right height (`fontScale.test.tsx`); only a device shows the
#    two-line title is whole and the pills' words are not cut. The slot driver
#    sets `settings put system font_scale 2.0` and relaunches the app (React
#    Native reads the font scale at startup), runs this, and puts it back.
#    The QA account has no Flow project, so this makes "[qa] Font 200" with
#    two cards and DELETES it at the end (the QA-account rule).
# 2. Notes' + tapped twice (fix 887b603). Maestro's doubleTapOn sends two
#    taps 100 ms apart, before the create answers on this box. The slot
#    driver counts the QA account's notes made in the window (read-only psql):
#    the proof is ONE. The note made is deleted from its editor (to the
#    trash, which the driver empties by its id afterwards through the app's
#    own trash view if one is left).
#
# English only: the cleanup taps the alert's "Delete" words.
#
# ── FLOW_REGISTER note ─────────────────────────────────────────────────────
# COVERS: the board's tiles at 200 % (a picture); one note per double tap.
# DOES NOT COVER: a double tap faster than 100 ms (Jest's three taps in one
#   act() do that, `notes-index.test.tsx`), every sheet at 200 %.
appId: ${APP_ID}
tags:
  - sweep
---
# NOT login.yaml: at 200 % Home's Assistant tile is below the fold and
# login's last step taps it (device, 2026-11-21 08:48). The driver signs in at
# 100 % first (set-language), then sets 200 % and relaunches: the app reopens
# signed in, on Home or inside the last app.
- launchApp
- openLink: ${DEEP_LINK}
# The app reopens in its last place, maybe a pushed screen (a back arrow,
# no Home button): Back until the Home button shows.
- extendedWaitUntil:
    visible:
      id: "app-header"
    timeout: 120000
- repeat:
    while:
      notVisible:
        id: "header-home"
    times: 4
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "home-tile-flow"
    commands:
      - tapOn:
          id: "header-home"
- scrollUntilVisible:
    element:
      id: "home-tile-flow"
- takeScreenshot: reports/46-font200-${W}-home

# ── 1. Flow at 200 % ───────────────────────────────────────────────────────
- tapOn:
    id: "home-tile-flow"
- extendedWaitUntil:
    visible:
      id: "flow-tabs"
    timeout: 60000
# Reuse "[qa] Font 200" if a stopped run left it (2026-11-21 09:11); else make it.
- runFlow:
    when:
      notVisible: "\\[qa\\] Font 200.*"
    commands:
      - runFlow:
          when:
            visible:
              id: "flow-empty-create"
          commands:
            - tapOn:
                id: "flow-empty-create"
      - runFlow:
          when:
            visible:
              id: "flow-new-project"
          commands:
            - tapOn:
                id: "flow-new-project"
      - tapOn:
          id: "flow-project-title"
      - inputText: "[qa] Font 200"
      - takeScreenshot: reports/46-font200-${W}-project-sheet
      - tapOn:
          id: "flow-project-save"
      - extendedWaitUntil:
          visible:
            id: "flow-board-pager"
          timeout: 60000
      - back
- tapOn: "\\[qa\\] Font 200.*"
- extendedWaitUntil:
    visible:
      id: "flow-board-pager"
    timeout: 60000
# The empty first column's own "Add a card" (a column's ids are its POSITION,
# which differs between servers, so its words: en or fr).
# lint: regex-ok — an alternation on purpose: the words in en or fr.
- tapOn: "(Add a card|Ajouter une carte)"
- tapOn:
    id: "flow-quick-add-input"
- inputText: "[qa] A title long enough to need its second line"
- tapOn:
    id: "flow-quick-add-submit"
- extendedWaitUntil:
    visible:
      id: "flow-card"
      text: "\\[qa\\] A title long.*"
    timeout: 20000
- inputText: "[qa] Short"
- tapOn:
    id: "flow-quick-add-submit"
- extendedWaitUntil:
    visible:
      id: "flow-card"
      text: "\\[qa\\] Short.*"
    timeout: 20000
- tapOn:
    id: "flow-quick-add-cancel"
- takeScreenshot: reports/46-font200-${W}-board
# Clean up by ids, not words: the project, with its confirm.
- back
- extendedWaitUntil:
    visible:
      id: "flow-tabs"
    timeout: 20000
- longPressOn: "\\[qa\\] Font 200.*"
- tapOn:
    id: "flow-project-menu-delete"
# lint: regex-ok — the alert's button, en or fr, either case (Android caps it).
- tapOn: "(Delete|DELETE|Supprimer|SUPPRIMER)"
- extendedWaitUntil:
    notVisible: "\\[qa\\] Font 200.*"
    timeout: 20000
- back

# ── 2. Notes: + tapped twice ───────────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "home-tile-notes"
    direction: UP
- tapOn:
    id: "home-tile-notes"
- extendedWaitUntil:
    visible:
      id: "notes-new"
    timeout: 30000
- doubleTapOn:
    id: "notes-new"
- extendedWaitUntil:
    visible:
      id: "note-toolbar"
    timeout: 30000
- tapOn:
    id: "tb-more"
- tapOn:
    id: "note-more-delete"
- tapOn:
    id: "note-more-delete-confirm"
- extendedWaitUntil:
    visible:
      id: "notes-new"
    timeout: 20000
# A second editor pushed by the second tap would sit here instead of the grid.
- assertNotVisible:
    id: "note-toolbar"
