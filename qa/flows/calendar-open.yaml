# Helper: from a signed-in app, open Calendar by the Home tile.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: "chat-close"
    commands:
      - tapOn:
          id: "chat-close"
- runFlow:
    when:
      visible:
        id: "header-home"
    commands:
      - tapOn:
          id: "header-home"
# Home keeps its scroll position, so the tile can be ABOVE (2026-11-25, 200 %):
# up first if it is not on screen, then down.
- runFlow:
    when:
      notVisible:
        id: "home-tile-calendar"
    commands:
      - scrollUntilVisible:
          element:
            id: "home-tile-calendar"
          direction: UP
          timeout: 10000
          optional: true  # lint: optional-ok — the tile may be below instead; the DOWN scroll after this is the check
- scrollUntilVisible:
    element:
      id: "home-tile-calendar"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "home-tile-calendar"
