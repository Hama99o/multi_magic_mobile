# THE FLOW THAT IS THE PRODUCT, and the only one that exercises the socket.
#
# `POST /api/v1/ai/show` returns 202 and the answer is broadcast later over
# ActionCable. So this asserts three separate things, in order:
#
#   1. the question is on screen IMMEDIATELY (drawn from the 202's own id);
#   2. the thinking indicator appears where the answer will go;
#   3. an answer actually ARRIVES — which no unit test can prove, because they
#      all mock the cable.
#
# If only one flow ever exists in this repo, it is this one.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: login.yaml
- takeScreenshot: reports/02-chat-before-asking

# TYPED, not tapped from the empty state. Two reasons, both learned the hard
# way: the QA account's conversation accumulates messages across runs, so the
# empty state is not there after the first pass; and the starter prompts are
# DERIVED now, so an account with nothing to derive from legitimately offers
# none. A flow that depends on either is asserting the fixture, not the product.
- tapOn:
    id: "composer-input"
- inputText: "Do I owe anyone money?"
- hideKeyboard
# BY ITS LABEL, not its testID. A disabled Pressable can drop out of the
# accessibility tree entirely, and Maestro reads that tree — so "Element not
# found: composer-send" meant "not in the tree right now", not "missing from
# the app". The label is what a user reaches for and is present either way.
- tapOn: "Send"

# 1. The question appears before any answer exists.
- assertVisible: "Do I owe anyone money?"
- takeScreenshot: reports/03-question-posted

# 2. Dots where the answer will be.
- assertVisible:
    id: "thinking"

# 3. The answer lands. Generous, because a RAG turn plus a provider call is
#    genuinely slow — but far short of the composer's own 3-minute release, so
#    a timeout here means "it did not arrive", not "we were impatient".
- extendedWaitUntil:
    notVisible:
      id: "thinking"
    timeout: 120000
- assertVisible:
    id: "assistant-answer"
- takeScreenshot: reports/04-answer-arrived
