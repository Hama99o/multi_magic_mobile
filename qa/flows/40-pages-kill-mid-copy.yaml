# M9 restart cleanup (Hello, 2026-11-21): the app killed while a picked file
# is still being copied in. On relaunch the row says the file is no longer on
# this phone, and the driver's listing shows no copy left behind
# (`pages-parity.sh run` lists Documents/pages-uploads before and after).
#
# COVERS: a kill inside the copy (proved by the relaunch wording), the kill, the relaunch, the row's
# missing-file wording.
# CANNOT TELL YOU: on its own, the disk (the driver's listing is the proof).
appId: ${APP_ID}
tags: [pages, parity, kill]
---
- runFlow: pages-open-trip.yaml
- tapOn:
    id: "pages-add"
- tapOn:
    id: "pages-new-files"
# The system picker opens on its last place (Documents on this AVD), not on
# Download (measured 2026-11-21): the storage root in its breadcrumb, then
# Download, where `pages-parity.sh device` put the fixtures.
- extendedWaitUntil:
    visible: "sdk_gphone.*"
    timeout: 20000
- tapOn: "sdk_gphone.*"
- tapOn: "Download"
# THE DRIVER KILLS THE APP (2026-11-24). Maestro's look for "Preparing…" came
# after an 800 MB copy had finished, 1302 MB tripped the 2.5 GB AVD's
# lowmemorykiller, and a killApp straight after the pick landed before the app
# even had the file. So `pages-parity.sh` watches the app's pages-uploads folder
# and force-stops it the moment a PARTIAL qa-huge.bin is there, logging the
# bytes copied (kill40.txt). The relaunch wording below is the app-side proof:
# only a row still "preparing" at launch says the file is no longer on this
# phone (uploads.store.ts:536); one killed after its copy comes back "checking".
- tapOn: "qa-huge.bin"
# A wait, not a check: nothing named this ever shows; it gives the driver's
# watcher up to 30 s to stop the app.
- extendedWaitUntil:
    visible: "kill40 sentinel never shown"
    timeout: 30000
    optional: true  # lint: optional-ok — a timed wait for the driver's kill; kill40.txt and the relaunch wording are the proof
- launchApp:
    stopApp: false
- runFlow: pages-open-trip.yaml
# pages-menu is Pages home's (index.tsx), not a folder's: the Home tab first.
- tapOn:
    id: "pages-tab-home"
- tapOn:
    id: "pages-menu"
- tapOn:
    id: "pages-menu-uploads"
- extendedWaitUntil:
    visible: "The file is no longer on this phone."
    timeout: 30000
- takeScreenshot: reports/40-after-kill-mid-copy
- tapOn:
    id: "pages-upload-cancel"
