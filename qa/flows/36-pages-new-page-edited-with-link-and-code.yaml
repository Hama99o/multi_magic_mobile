# M7 + M8 (parity #22, #50): a new page is named, opens in the editor, takes
# text, a link and a code block with a language, and saves itself.
#
# COVERS: New > New page > name "QA page" > the editor; typing; "Saved"
# after the one-second autosave; the link dialog opened, filled and saved on a
# selection; a code block made and its language sheet choosing Ruby.
# CANNOT TELL YOU: Insert > Image (the system photo picker, by hand); how
# the saved page looks on the web (another client).
appId: ${APP_ID}
tags: [pages, parity]
---
- runFlow: pages-open-trip.yaml
- tapOn:
    id: "pages-add"
- tapOn:
    id: "pages-new-page"
- tapOn:
    id: "pages-name-input"
- inputText: "QA page"
- tapOn:
    id: "pages-name-confirm"
- extendedWaitUntil:
    visible:
      id: "note-toolbar"
    timeout: 30000
# FOCUS THE EDITOR FIRST. Measured 2026-11-21: typing with nothing focused
# sent key events to the activity, and the dev client's key commands
# (expo-dev-menu DevMenuFragment.onKeyUp, debug builds only) took the "r" of
# "from" as Reload and the "p" of "phone" as the performance monitor. The
# editor's accessibility label is its placeholder (pages.page.placeholder).
# lint: anchored-ok — the editor's whole accessibility label
- tapOn: "Write here"
- inputText: "Hello from the phone"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
- takeScreenshot: reports/36-page-typed
# A selection, then Link. A long press selects a word on Android; the double
# tap left no selection in this editor, so the bar never showed Link (device,
# 2026-11-24: the + · T · undo · redo row, keyboard up and clear).
- longPressOn: "Hello from the phone"
- extendedWaitUntil:
    visible:
      id: "tb-link"
    timeout: 10000
- tapOn:
    id: "tb-link"
- tapOn:
    id: "page-link-input"
- inputText: "example.com"
- tapOn:
    id: "page-link-save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
# A code block with a language. The link save leaves "phone" selected, and a
# selection shows the marks row, which has no Format key (toolbarModel.ts:179,
# measured on device 2026-11-24): a tap in the line collapses it to a caret.
- tapOn: "Hello from the phone"
- extendedWaitUntil:
    visible:
      id: "tb-format"
    timeout: 10000
- tapOn:
    id: "tb-format"
- tapOn:
    id: "tb-block:codeBlock"
# The Format panel stays open after a pick; the language key is on the main
# row (toolbarModel.ts:190), so close the panel first (device, 2026-11-24).
- tapOn:
    id: "tb-closePanel"
- tapOn:
    id: "tb-codeLanguage"
- tapOn:
    id: "page-code-language-search"
- inputText: "ruby"
- tapOn:
    id: "page-code-language-ruby"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
- takeScreenshot: reports/36-page-link-code
