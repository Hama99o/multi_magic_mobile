# CONTACTS, the release-readiness pass (docs/RELEASE_READINESS.md, ff's row).
#
# Run by the slot driver once per outside column it sets: W (360/411/800 dp),
# THEME, FONT (`font_scale` 1.0/2.0), NET (online/offline). Shots are named
# `48-${W}-${THEME}-f${FONT}-${NET}-…`.
#
# As the QA account on :3001 only:
# 1. Contacts from Home: the list with its A–Z headers (at 200 % each row must
#    hold its two lines: fix on `fix/contacts-font-scale`), a search that
#    finds nothing (the empty result) -> pictures.
# 2. ONLINE only: a new contact "[qa] Readiness". The keyboard over the first
#    name -> a picture. Save is DOUBLE-TAPPED: the driver's read-only count of
#    contacts with that name must be ONE. Its card -> a picture.
# 3. Cleanup: Delete from the card (to the trash); 48b deletes it for ever by
#    the id the driver read, and the driver logs it gone.
#
# ── FLOW_REGISTER note ─────────────────────────────────────────────────────
# COVERS: states, keyboard, double tap, the 200 % row, outside columns.
# DOES NOT COVER: import from the phone book and permission denied (the
#   contacts permission prompt is the system's; a separate run with the
#   permission revoked by `pm revoke`), sharing a contact (two-person).
appId: ${APP_ID}
tags:
  - contacts
  - readiness
---
# OFFLINE runs skip the relaunch: the driver signed in just before and then
# cut the network, and a relaunched dev client cannot reach Metro offline
# (measured 2026-11-25 on flow 47).
- runFlow:
    when:
      true: ${NET != "offline"}
    commands:
      - launchApp
      - openLink: ${DEEP_LINK}
# login.yaml ends on the Assistant, which has no app header: close it.
- runFlow:
    when:
      visible:
        id: "chat-close"
    commands:
      - tapOn:
          id: "chat-close"
- extendedWaitUntil:
    visible:
      id: "app-header"
    timeout: 120000
- repeat:
    while:
      notVisible:
        id: "header-home"
    times: 4
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - tapOn:
          id: "header-home"
- scrollUntilVisible:
    element:
      id: "home-tile-contacts"
- tapOn:
    id: "home-tile-contacts"
# The QA account's book may be EMPTY (it was on 2026-11-21): the empty
# state has no search field, and is a legitimate state, pictured, not asserted.
# The ⋮ menu shows in both states (empty or not); the A–Z strip only with
# two letters or more.
- extendedWaitUntil:
    visible:
      id: "contacts-more"
    timeout: 60000
- takeScreenshot: reports/48-${W}-${THEME}-f${FONT}-${NET}-list
- runFlow:
    when:
      visible:
        id: "contacts-search"
    commands:
      - tapOn:
          id: "contacts-search"
      - inputText: "zqx-qa-none"
      - assertVisible:
          id: "contacts-search"
      - takeScreenshot: reports/48-${W}-${THEME}-f${FONT}-${NET}-no-match
      - tapOn:
          id: "contacts-search-clear"
      # The search field keeps focus and its keyboard covers the + button
      # (measured 2026-11-25): the IME is up here, so this closes it and
      # cannot reach the app as Back.
      - hideKeyboard

- runFlow:
    when:
      true: ${NET == "online"}
    commands:
      # From the empty state's own button, or the list's +.
      - runFlow:
          when:
            visible:
              id: "contacts-empty-new"
          commands:
            - tapOn:
                id: "contacts-empty-new"
      - runFlow:
          when:
            notVisible:
              id: "contact-form-firstname"
          commands:
            - tapOn:
                id: "contacts-new"
      - extendedWaitUntil:
          visible:
            id: "contact-form-firstname"
          timeout: 20000
      - tapOn:
          id: "contact-form-firstname"
      - inputText: "[qa] Readiness"
      - assertVisible:
          id: "contact-form-firstname"
      - takeScreenshot: reports/48-${W}-${THEME}-f${FONT}-${NET}-keyboard
      - doubleTapOn:
          id: "contact-form-save"
      - extendedWaitUntil:
          visible:
            id: "contact-name"
          timeout: 30000
      - takeScreenshot: reports/48-${W}-${THEME}-f${FONT}-${NET}-card
      # The list WITH a row and its letter header: the 200 % fix's picture.
      - back
      - extendedWaitUntil:
          visible: "\\[qa\\] Readiness.*"
          timeout: 20000
      - assertVisible:
          id: "contacts-more"
      - takeScreenshot: reports/48-${W}-${THEME}-f${FONT}-${NET}-list-with-row
      - tapOn: "\\[qa\\] Readiness.*"
      - extendedWaitUntil:
          visible:
            id: "contact-name"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "contact-delete"
      - tapOn:
          id: "contact-delete"
      - extendedWaitUntil:
          visible: "Delete \\[qa\\] Readiness\\?"
          timeout: 10000
      # lint: regex-ok — the alert's button, either case (Android caps it).
      - tapOn: "(Delete|DELETE)"
      # Back on the list, which may be empty again (no search field then).
      - extendedWaitUntil:
          visible:
            id: "contacts-more"
          timeout: 20000
