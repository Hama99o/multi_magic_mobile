- runFlow: pages-open-trip.yaml
# lint: anchored-ok — the seeded folder "Day 1" is a whole row title
- tapOn: "Day 1"
- extendedWaitUntil:
    visible:
      id: "pages-folder-empty"
    timeout: 20000
- takeScreenshot: reports/47-empty-folder
