# NOTES SHEETS ON THE ONE SHEET FRAME (Hello for the owner, 2026-11-21:
# "Notes bottom sheets span the full width at 800 dp").
#
# Every Notes sheet now draws through `src/components/SheetFrame.tsx`: a
# bottom sheet the width of the screen on a phone, a centred 560 dp card on a
# tablet (>= SPLIT_AT, 800 dp). Jest proves the frame's width and position
# (`SheetFrame.test.tsx`, `notes-index` "sheets on a tablet"); only a device
# shows the card actually sits centred with the scrim around it, in both
# themes. This opens each sheet on the note NOTE (found by QUERY), takes its
# picture, and closes it with Back. Run on the local demo stack (:3020, its
# invented data): on :3001 use QUERY=qa-shot NOTE="\\[qa-shot\\] Groceries", never a
# real note. It WRITES NOTHING: no colour is picked, no
# reminder saved, no one invited.
#
# Run by the slot driver at 411 and 800 dp, light and dark: W and THEME name
# the shots (`docs/design/app-shell/ours/`).
#
# ── FLOW_REGISTER note ─────────────────────────────────────────────────────
# COVERS: the editor's colour, ⋮, reminder, share and Labels sheets; the
#   drawer's Edit labels; each opened from where a person opens it.
# DOES NOT COVER: the grid's selection ⋯ (a long press, which Maestro's
#   longPressOn does not land here: CLAUDE.md, the 06-people-chat note), the
#   code-language sheet (needs a code block), "Linked in Pages" (needs a link).
appId: ${APP_ID}
tags:
  - notes
---
# NOT login.yaml's last step: at 360 dp and at 200 % Home's Assistant tile is
# below the fold and login taps it (device, 2026-11-21). The slot driver signs
# in first (set-language), so the app reopens signed in: Home, or inside the
# last app, whose header has the Home button.
- launchApp
- openLink: ${DEEP_LINK}
# The app reopens in its last place, maybe a pushed screen (a back arrow,
# no Home button): Back until the Home button shows.
- extendedWaitUntil:
    visible:
      id: "app-header"
    timeout: 120000
- repeat:
    while:
      notVisible:
        id: "header-home"
    times: 4
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - tapOn:
          id: "header-home"
- scrollUntilVisible:
    element:
      id: "home-tile-notes"
- tapOn:
    id: "home-tile-notes"
# Only the note asked for (on :3001 the QA account also holds copies of real notes).
- tapOn:
    id: "notes-search"
- inputText: "${QUERY}"
- pressKey: Enter
- extendedWaitUntil:
    visible: "${NOTE}"
    timeout: 30000

# The drawer's Edit labels sheet.
- tapOn:
    id: "notes-menu"
- tapOn:
    id: "drawer-edit-labels"
- extendedWaitUntil:
    visible:
      id: "labels-close"
    timeout: 15000
- takeScreenshot: reports/44-${W}-${THEME}-edit-labels
- tapOn:
    id: "labels-close"

# A note's editor, and each sheet it opens.
- tapOn: "${NOTE}"
- extendedWaitUntil:
    visible:
      id: "note-toolbar"
    timeout: 30000

- tapOn:
    id: "tb-noteColor"
- extendedWaitUntil:
    visible:
      id: "note-color-no_color"
    timeout: 10000
- takeScreenshot: reports/44-${W}-${THEME}-color
- pressKey: Back

- tapOn:
    id: "tb-more"
- extendedWaitUntil:
    visible:
      id: "note-more-edited"
    timeout: 10000
- takeScreenshot: reports/44-${W}-${THEME}-more
- tapOn:
    id: "note-more-labels"
- extendedWaitUntil:
    visible:
      id: "note-labels-close"
    timeout: 10000
- takeScreenshot: reports/44-${W}-${THEME}-note-labels
- tapOn:
    id: "note-labels-close"

- tapOn:
    id: "note-edit-reminder"
- extendedWaitUntil:
    visible:
      id: "reminder-save"
    timeout: 10000
- takeScreenshot: reports/44-${W}-${THEME}-reminder
- pressKey: Back

- tapOn:
    id: "note-edit-share"
- extendedWaitUntil:
    visible:
      id: "note-share-sheet"
    timeout: 10000
- takeScreenshot: reports/44-${W}-${THEME}-share
- tapOn:
    id: "note-share-close"

- tapOn:
    id: "note-edit-back"
