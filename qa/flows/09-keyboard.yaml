# THE COMPOSER MUST SURVIVE THE KEYBOARD.
#
# The field somebody is typing into is the one thing that cannot be hidden, and
# on iOS nothing resizes the window — without `KeyboardAvoidingView` the
# keyboard sits straight over the composer. Android's resize masks the mistake,
# which is exactly why this is asserted rather than eyeballed on one platform.
#
# What it can prove on an emulator: that with the keyboard raised, the field,
# its send button and its attach button are all still on screen and hittable.
# What it cannot: how it looks on iOS.
#
# ── A CORRECTION, 2026-09-19 ──────────────────────────────────────────────
# This header used to say Gboard was in FLOATING mode on this AVD, and that a
# floating keyboard produces no inset — "the easy case, not the hard one". That
# claim was wrong, and it was load-bearing: it was the reason to doubt this
# flow rather than the screen. `reports/50-keyboard-up.png` from the first real
# run shows a DOCKED, full-width Gboard with the composer sitting above it.
# This flow runs the hard case and always did.
#
# It had also never been run. The row said UNRUN, so when
# `28cf795` fixed a composer that really did go under the keyboard, there was
# no green here to have been vacuous — there was nothing at all. A flow that is
# written and never executed proves exactly as much as no flow.
appId: ${APP_ID}
tags:
  - smoke
  - keyboard
---
- runFlow: login.yaml

- tapOn:
    id: "composer-input"
- inputText: "does the composer stay above the keyboard"

# All three still visible WITH the keyboard up. If the composer had been pushed
# under it, these are the assertions that would fail.
- assertVisible:
    id: "composer-input"
- assertVisible:
    id: "composer-send"
- assertVisible:
    id: "composer-attach"
- takeScreenshot: reports/50-keyboard-up

# ── THE DRAFT SURVIVES THE KEYBOARD CLOSING ────────────────────────────────
# `hideKeyboard` on Android is a BACK press, which is only safe while an IME is
# up to consume it. Here one provably is — the step above asserted the
# keyboard-up state and nothing has dismissed it — and this screen is the ROOT
# route, so if the press ever did reach the app it would background it and the
# assertion immediately below would fail loudly rather than the flow drifting
# on. It is also the step's whole purpose: closing the keyboard is the event
# whose effect on the draft is being measured.
- hideKeyboard
- assertVisible:
    id: "composer-input"
    text: "does the composer stay above the keyboard"
- takeScreenshot: reports/51-keyboard-down

# The clear control appears only with a draft, and must be reachable too.
- assertVisible:
    id: "composer-clear"
- tapOn:
    id: "composer-clear"
- assertVisible:
    id: "composer-input"
- takeScreenshot: reports/52-draft-cleared

# ── LAST, NOT FIRST — and the reason is a measurement ─────────────────────
# This block ran BEFORE the composer assertions and cost them. On the QA
# account the assistant conversation is two answers and fits on one screen, so
# there is no bottom to be away from, the button correctly never appears, and
# the premise step failed loudly exactly as designed — taking the composer
# half, which passes, down with it. Evidence that exists should not be
# forfeited to prove a second thing.
# ── AND THE CONVERSATION MUST STAY AT THE BOTTOM WHEN IT ARRIVES ──────────
#
# His report: *"when i go to bottom of session and i open keyboard it hide what
# it showed — it should push the session conversation up to see the latest
# thing."* The composer surviving is not enough; the keyboard shrinks the list,
# and if nothing re-scrolls, the newest message goes behind the composer while
# the composer itself looks perfect. That is what he photographed.
#
# `scroll-to-bottom` is the instrument. It renders only while the reader is
# away from the newest message, so "we are still at the bottom" and "the button
# is not offered" are the same fact, and the second one is a selector.
#
# FIRST, PROVE THIS CONVERSATION HAS A BOTTOM TO BE AWAY FROM. If the QA
# account's thread fits on one screen the button can never appear, and every
# assertion below would pass by being unreachable rather than by being true —
# `FLOW_REGISTER.md`'s empty-state rule. This step fails loudly in that case
# instead, and the failure is the finding.
- swipe:
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    visible:
      id: "scroll-to-bottom"
    timeout: 8000
- takeScreenshot: reports/48-scrolled-up-button-offered

# Back to the newest. The button going away is the app agreeing we arrived.
- tapOn:
    id: "scroll-to-bottom"
- extendedWaitUntil:
    notVisible:
      id: "scroll-to-bottom"
    timeout: 8000
- takeScreenshot: reports/49-at-bottom-keyboard-down

# Give the button every chance to appear before denying it. Without this the
# assertion below could pass in the gap between the keyboard opening and the
# list re-measuring — a pass that means "not yet" rather than "not at all".
# lint: optional-ok — this is a DELAY, not the assertion. The claim is the
# `assertNotVisible` immediately after it, which cannot be optional and is not.
- extendedWaitUntil:
    visible:
      id: "scroll-to-bottom"
    timeout: 3000
    optional: true

# THE ASSERTION HIS REPORT IS ABOUT. Away from the bottom with the keyboard up
# means the newest message is behind the composer.
- assertNotVisible:
    id: "scroll-to-bottom"
- takeScreenshot: reports/49b-at-bottom-keyboard-up
