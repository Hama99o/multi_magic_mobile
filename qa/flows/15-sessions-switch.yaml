# SWITCHING CONVERSATIONS — by title, the way a person does, and cleaned up after.
#
# `docs/design/sessions/SPEC.md`: a SHEET, not a drawer, and the row menu's
# order is a safety mechanism. `04-delete-conversation` covers the menu and the
# confirm's wording; this flow covers the thing the sheet exists for — picking a
# different conversation and landing in it — and the rename that makes a row
# nameable.
#
# ── NO SELECTOR HERE IS A DATABASE ID ────────────────────────────────────
# `session-row-<id>` and `session-menu-<id>` are testIDs built on record ids,
# which Hamma9901's rule and `flow_lint`'s DBID both call a finding, not a
# selector: a flow that taps `session-menu-.*` cannot say WHICH row it meant.
# So this flow names rows the way a user does. A new conversation arrives with
# the server's default title (`Ai::Sessions::DEFAULT_TITLE`, "New chat") at the
# TOP of Today, its menu button is labelled "Options for New chat", and once
# renamed the row is "QA switch target, 0 messages" and its menu "Options for
# QA switch target". Titles are the selectors; the ids stay in the finding.
#
# ── THE PROOF OF A SWITCH ────────────────────────────────────────────────
# Two proofs, because each alone can be fooled. A brand-new conversation is
# EMPTY — `chat-empty` — and the QA account's standing conversation is not,
# so the empty state appearing after "New conversation" proves the screen moved
# to the new one. (That non-emptiness is RESIDUE: old `01-ask` runs put it
# there, and since 2026-09-24 `01` asks in a conversation of its own and deletes
# it, so nothing replenishes it. It still holds today; it is not guaranteed.) And after switching
# back by title, the sheet marks that row `selected`, which is `activeId` and
# nothing else.
#
# ── AND IT DELETES WHAT IT MADE ──────────────────────────────────────────
# Two conversations are created per run. Left behind, the QA account hits the
# cap of 50 in twenty-five runs and every flow that presses "New conversation"
# starts failing on a full account. So both are renamed to names nobody else
# uses and deleted at the end, through the same confirm `04` stops at — real
# deletions, of rows THIS flow created, on the QA account, and nothing else.
# The guarantee sentence is asserted on the way past.
appId: ${APP_ID}
tags:
  - sessions
---
- runFlow: login.yaml
- tapOn:
    id: "chat-open-sessions"
- assertVisible:
    id: "sessions-sheet"
- assertVisible: "Conversations"
- takeScreenshot: reports/79-sessions-sheet

# ── THE PRECONDITION, SET DELIBERATELY, BEFORE ANYTHING IS CREATED ────────
# This flow used to inherit its starting state from whatever earlier runs had
# left in the account, and then assert `notVisible` on a name a previous run
# had already written. That is not a flaky flow, it is a flow whose verdict
# depends on how many times it has been run (`qa/QA_HANDBOOK.md`, "A flow that
# writes and never cleans up").
#
# ── AND IT RUNS RIGHT HERE, WITH THE SHEET ALREADY OPEN ──────────────────
# The register recorded four reverted attempts at this, all of them written
# against a cause that was wrong: "deleting closes the sheet" and "a cleanup
# that opens its own sheet finds no `chat-open-sessions`". Measured 2026-09-22:
# deleting does NOT close the sheet — `destroy.onSuccess` calls `refresh`,
# `setPending` and `onOpenSession`, and `onClose` is on none of those paths
# (gated by `SessionsSheet.test.tsx`, "leaves the sheet OPEN afterwards"). And
# `chat-open-sessions` being unreachable is not a bug at all: it is a `Modal`
# covering the header, behaving correctly.
#
# So there is nothing to open and nothing to reopen. The sheet is open on the
# line above. Bounded at four rather than looped on a condition, because a
# delete that silently stops working must end this flow rather than spin.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: "Options for QA switch target"
          commands:
            - tapOn: "Options for QA switch target"
            - tapOn:
                id: "session-menu-delete"
            - tapOn:
                id: "delete-conversation-yes"
            # The confirm must actually CLOSE before the next iteration looks
            # at the sheet. Without this the first run of this cleanup left the
            # dialog up, every later step ran against a covered sheet, and the
            # two assertions below passed by being unreachable.
            - extendedWaitUntil:
                notVisible:
                  id: "delete-conversation-confirm"
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible: "Options for QA switch other"
          commands:
            - tapOn: "Options for QA switch other"
            - tapOn:
                id: "session-menu-delete"
            - tapOn:
                id: "delete-conversation-yes"
            # The confirm must actually CLOSE before the next iteration looks
            # at the sheet. Without this the first run of this cleanup left the
            # dialog up, every later step ran against a covered sheet, and the
            # two assertions below passed by being unreachable.
            - extendedWaitUntil:
                notVisible:
                  id: "delete-conversation-confirm"
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 5000
# ── POSITIVE FIRST, OR THE TWO BELOW ARE TOOTHLESS ───────────────────────
# `assertNotVisible` cannot tell "the row is gone" from "something is covering
# the sheet". The first run of this cleanup proved that the hard way: a delete
# confirm stayed up, both assertions passed against a covered sheet, and the
# flow then failed four steps later on `sessions-new` — a real dialog, an
# invisible cause, and a green assertion in between. So the sheet is asserted
# PRESENT and usable first, and the absences mean something only after it.
- assertVisible:
    id: "sessions-sheet"
- assertVisible:
    id: "sessions-new"
# Now it is true because this flow made it true, not because the account
# happened to be in that state — nor because nothing was visible at all.
- assertNotVisible: "Options for QA switch target"
- assertNotVisible: "Options for QA switch other"
- takeScreenshot: reports/79b-precondition-set

# ── At the cap there is nothing to create: say so and stop ───────────────
# NOT MEASURED past here, which is a different fact from passed. Delete a
# conversation from the QA account by hand and re-run.
- runFlow:
    when:
      visible:
        id: "sessions-at-limit"
    commands:
      - assertVisible: "You have 50 conversations, which is the most MultiMagic keeps.*"
      - takeScreenshot: reports/80-sessions-at-limit-NOT-MEASURED

- runFlow:
    when:
      notVisible:
        id: "sessions-at-limit"
    commands:
      # ── New, and it opens: the empty state is the proof ──────────────
      - tapOn:
          id: "sessions-new"
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 30000
      - extendedWaitUntil:
          visible:
            id: "chat-empty"
          timeout: 30000
      - takeScreenshot: reports/81-new-conversation-is-empty

      # ── Name it, from its own row's menu ─────────────────────────────
      - tapOn:
          id: "chat-open-sessions"
      - tapOn: "Options for New chat"
      - assertVisible:
          id: "session-menu"
      # Clear FIRST — the order is the safety mechanism.
      - assertVisible: "Clear messages"
      # ── ALL FOUR ENTRIES BY HANDLE, NOT JUST THE ONE WE USE ───────────
      # `flow_lint --untouched` found `session-menu-clear`,
      # `session-menu-instructions` and `session-menu-scope` reached by
      # nothing in the suite — three entries on a menu this flow already
      # opens and then walks past. Asserting they are PRESENT is not the
      # same as exercising them, and neither Clear nor Scope nor
      # Instructions is exercised here: Clear would empty a conversation
      # and the other two open dialogs this flow does not enter. What this
      # does prove is that the menu a person opens has all four, in a
      # build where any of them could have been dropped silently.
      - assertVisible:
          id: "session-menu-clear"
      - assertVisible:
          id: "session-menu-rename"
      - assertVisible:
          id: "session-menu-instructions"
      - assertVisible:
          id: "session-menu-scope"
      - tapOn:
          id: "session-menu-rename"
      - assertVisible:
          id: "rename-dialog"
      # The dialog's own two controls. `15` renames twice and had never named
      # either — it saves with Enter, which the field's `onSubmitEditing`
      # performs, so the BUTTON had never been asserted to exist at all.
      - assertVisible:
          id: "rename-save"
      - assertVisible:
          id: "rename-cancel"
      - tapOn:
          id: "rename-input"
      - eraseText: 60
      - inputText: "QA switch target"
      # The field is returnKeyType "done" with onSubmitEditing saving, so Enter
      # IS the save, and no hideKeyboard is needed in front of a button.
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "QA switch target.*"
          timeout: 20000
      - takeScreenshot: reports/82-renamed

      # ── A second one, so there is something to switch FROM ───────────
      - tapOn:
          id: "sessions-new"
      - extendedWaitUntil:
          visible:
            id: "chat-empty"
          timeout: 30000
      - tapOn:
          id: "chat-open-sessions"
      - tapOn: "Options for New chat"
      - tapOn:
          id: "session-menu-rename"
      - tapOn:
          id: "rename-input"
      - eraseText: 60
      - inputText: "QA switch other"
      # Same reasoning: Enter is the save.
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "QA switch other.*"
          timeout: 20000
      # The one we just made is the active row.
      - assertVisible:
          text: "QA switch other.*"
          selected: true

      # ── THE SWITCH, by title ─────────────────────────────────────────
      - tapOn: "QA switch target.*"
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 30000
      - tapOn:
          id: "chat-open-sessions"
      # THE ASSERTION: the sheet marks the row we chose as the active one.
      - assertVisible:
          text: "QA switch target.*"
          selected: true
      - takeScreenshot: reports/83-switched-by-title

      # ── Clean up: delete both, through the real confirm ──────────────
      - tapOn: "Options for QA switch target"
      - tapOn:
          id: "session-menu-delete"
      - assertVisible:
          id: "delete-conversation-confirm"
      - assertVisible: "Delete this conversation?"
      # The guarantee, on the way past.
      - assertVisible: "Your notes, contacts, loans and money are not touched."
      - tapOn:
          id: "delete-conversation-yes"
      - extendedWaitUntil:
          notVisible: "QA switch target.*"
          timeout: 20000
      - tapOn: "Options for QA switch other"
      - tapOn:
          id: "session-menu-delete"
      - assertVisible:
          id: "delete-conversation-confirm"
      - tapOn:
          id: "delete-conversation-yes"
      - extendedWaitUntil:
          notVisible: "QA switch other.*"
          timeout: 20000
      - takeScreenshot: reports/84-cleaned-up
      # The server hands back a conversation to fall back to, so the app is
      # never left with nowhere to talk.
      - tapOn:
          id: "sessions-close"
      - assertVisible:
          id: "composer-input"
