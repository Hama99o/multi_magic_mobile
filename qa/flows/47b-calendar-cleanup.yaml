# Cleanup for 47: the "[qa] DST weekly" series it made, deleted (whole, to the
# trash) by the id the slot driver read (read-only). For when 47 stopped
# before its own cleanup (2026-11-21: the list shows 7 days, the March 2027
# event was not in it).
#
# ── FLOW_REGISTER note ─────────────────────────────────────────────────────
# COVERS: nothing new; it puts the QA account back.
appId: ${APP_ID}
tags:
  - calendar
---
# The event by the app's own route: this is cleanup, not a path under test.
- openLink: "multimagic://calendar/event?id=${EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-delete"
    timeout: 30000
- assertVisible: "\\[qa\\] DST weekly"
- tapOn:
    id: "event-delete"
- extendedWaitUntil:
    visible: "Delete “\\[qa\\] DST weekly”\\?"
    timeout: 10000
# lint: regex-ok — the alert's button, either case (Android caps it).
- tapOn: "(Delete|DELETE)"
- extendedWaitUntil:
    notVisible:
      id: "event-delete"
    timeout: 20000
