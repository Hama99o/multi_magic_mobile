# M9 restart cleanup: the app killed while a copied file is being SENT. On
# relaunch the row checks the server and carries on; it finishes, and its
# copy is deleted (the driver's listing after).
#
# COVERS: "Uploading" seen, the kill, the relaunch, the row finishing
# ("Saved in …").
# CANNOT TELL YOU: iOS's background session (finishes with no JS running).
appId: ${APP_ID}
tags: [pages, parity, kill]
---
- runFlow: pages-open-trip.yaml
- tapOn:
    id: "pages-add"
- tapOn:
    id: "pages-new-files"
# The system picker opens on its last place (Documents on this AVD), not on
# Download (measured 2026-11-21): the storage root in its breadcrumb, then
# Download, where `pages-parity.sh device` put the fixtures.
- extendedWaitUntil:
    visible: "sdk_gphone.*"
    timeout: 20000
- tapOn: "sdk_gphone.*"
- tapOn: "Download"
- tapOn: "qa-big.bin"
- extendedWaitUntil:
    visible: "Uploading.*|Sending…"
    timeout: 120000
- killApp
- launchApp:
    stopApp: false
- runFlow: pages-open-trip.yaml
# pages-menu is Pages home's (index.tsx), not a folder's: the Home tab first.
- tapOn:
    id: "pages-tab-home"
- tapOn:
    id: "pages-menu"
- tapOn:
    id: "pages-menu-uploads"
- extendedWaitUntil:
    visible: "Saved in .*"
    timeout: 600000
- takeScreenshot: reports/41-after-kill-mid-upload
