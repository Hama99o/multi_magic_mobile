# ASK FOR A RESET LINK — and assert the request was ACCEPTED, not that mail arrived.
#
# `PUT /api/v1/users/reset_password`, NOT `resources :passwords`, which is
# SafeZone's password VAULT; the SPEC caught that one from the route declaration
# and `app/forgot-password.tsx`'s header records it.
#
# ── WHAT "ACCEPTED" MEANS HERE, AND WHY IT IS THE WHOLE ASSERTION ────────
# The server does `user&.reset_password!` then an unconditional `head :ok`
# (`users_controller.rb:72-76`) — 200 whether or not the address exists, so a
# stranger cannot learn which emails have accounts. The screen therefore has
# exactly one success state, `forgot-password-sent`, and it appears only on a
# 2xx. Seeing it IS the proof the request was accepted. Whether a mail then
# arrives is the mail provider's fact and the QA inbox's, not this app's.
#
# ── THE ADDRESS IS THE QA ACCOUNT'S, AND THE BUDGET IS FIVE ──────────────
# `.env`'s QA_EMAIL, never his (`RIG_CONTRACT.md` §3): every run puts a real
# reset token on that account and a real mail in its inbox. `rack_attack.rb`
# allows 5 of these per 15 minutes from one IP; a sixth run inside that window
# fails on `forgot-password-sent` with the throttle's own `too_many_requests`
# on screen — the rig's budget, not the app.
#
# The confirmation step is web-only in v1 by design (the emailed link opens the
# web app), so there is nothing after "Check your email" for a flow to reach.
appId: ${APP_ID}
tags:
  - auth
---
- runFlow: signed-out.yaml

# The door: the first way out of sign-in.
- tapOn:
    id: "sign-in-forgot"
- extendedWaitUntil:
    visible:
      id: "forgot-password-email"
    timeout: 30000
- assertVisible: "Reset your password"
- assertVisible: "Enter your email and we will send a link to set a new password."
- takeScreenshot: reports/63-forgot-password-empty

# ── Validate on press, with copy that says which email ───────────────────
- tapOn:
    id: "forgot-password-submit"
- assertVisible:
    id: "forgot-password-error"
- assertVisible: "Enter the email you signed up with."
- takeScreenshot: reports/64-forgot-password-empty-error

# ── The QA address, submitted from the keyboard ──────────────────────────
- tapOn:
    id: "forgot-password-email"
- inputText: ${EMAIL}
# Typing clears the error — the field's onChangeText does that, so a stale
# "enter the email" cannot sit above an address that is now there.
- assertNotVisible:
    id: "forgot-password-error"
# The field is `returnKeyType="go"` with `onSubmitEditing`, so Enter IS the
# submit — one request, from the control a phone user actually reaches for.
# (The button was exercised above. Closing the IME first and tapping the button
# would either cost a second request or, with hideKeyboard, risk a Back press
# popping this pushed screen — see flow_lint's HIDEKEY.)
- pressKey: Enter
# THE ASSERTION: the server accepted the request. This state exists on no other
# path than a 2xx.
- extendedWaitUntil:
    visible:
      id: "forgot-password-sent"
    timeout: 30000
- assertVisible: "Check your email"
# The copy that does NOT say whether the address was known. If anybody ever
# "improves" it to "we sent you a link", this is what fails.
- assertVisible: "If that address has a MultiMagic account, we have sent it a link to reset the password. The link opens MultiMagic on the web."
- takeScreenshot: reports/65-forgot-password-accepted

# ── The way back ─────────────────────────────────────────────────────────
- tapOn:
    id: "forgot-password-back"
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000
