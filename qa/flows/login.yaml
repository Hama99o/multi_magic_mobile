# END signed in on the assistant, whatever state the app was left in, and
# arrived at the way a person now arrives: from HOME.
#
# ── 2026-11-07: the app opens on Home, not on the assistant ───────────────
# The owner's new shell (`app/home.tsx`) made Home the first screen and the
# assistant an overlay opened from it (the AI button, the "Assistant" tile).
# This flow still waited for `composer-input` as "signed in", so on a
# signed-in app it saw no composer, waited for a sign-in screen that never
# came, and EVERY flow failed before its first step. Signed in is now Home
# (`home-tile-pages`) or the assistant; the flow then opens the assistant
# from the Home tile, so the flows after it start where they always did.
#
# ── Why this does not force a signed-OUT state first ──────────────────────
# It used to: sign out if a session was open, then sign in, so every flow
# started identically. That is tidy and it was wrong twice over.
#
# Expo Go restores the route the app was last on, so a launch can land on
# /chats or /calendar. Then neither the sign-in field nor the composer is
# present, the sign-out branch is skipped, and the flow fails asserting a
# sign-in screen on an app that is signed in and merely somewhere else — an
# assertion naming our login while the real state is a restored route.
#
# What every flow actually needs is a signed-in assistant. So: back out of
# wherever we are, and sign in only if we are not already.
appId: ${APP_ID}
---
- launchApp
- openLink: ${DEEP_LINK}

# The bundle is fetched over the network on a cold start and this box is slow.
# Wait on EITHER end state rather than assuming which one.
# lint: optional-ok — waits on ONE of two legitimate end states; the other
# branch below handles absence, so this is a race, not an assertion.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 120000
    optional: true
# lint: optional-ok — the other of those two end states; whichever arrives,
# the guards below read it.
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 30000
    optional: true
# lint: optional-ok — Home is the third legitimate end state since 2026-11-07.
- extendedWaitUntil:
    visible:
      id: "home-tile-pages"
    timeout: 10000
    optional: true

# Expo Go's developer menu opens on gestures Maestro produces and covers the
# screen while swallowing every tap under it. Measured: three flows "failed to
# open" a sheet that was rendering perfectly behind the menu.
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

# AND THE DEV CLIENT'S MENU, which is a different menu with different words.
#
# The guard above is Expo Go's. A development build shows its own overlay —
# "Element inspector", "Fast Refresh", "Go home", "Connected to: <url>" — and
# nothing in it says "This is the developer menu", so that guard never fires.
# Measured 2026-09-21: every dev-build run of this flow failed asserting
# `sign-in-email` while the app was loaded and running underneath the overlay,
# which reads exactly like the app failing to start.
#
# Back dismisses it. Safe here for the same reason the Back below is safe: it
# only runs when the overlay is provably up, and the guards after it re-check
# the real state either way.
- runFlow:
    when:
      visible: "Element inspector"
    commands:
      - pressKey: Back

# The assistant left open OVER something (it is an overlay now): close it.
- runFlow:
    when:
      visible:
        id: "chat-close"
    commands:
      - tapOn:
          id: "chat-close"

# NO "Back from a pushed screen" step any more. `launchApp` restarts the
# app, so the stack is fresh: Home, the assistant or sign-in, never a pushed
# screen. The Back step that was here (2026-11-07 morning) fired during a
# slow cold start, when neither Home nor sign-in was drawn yet, and pressed
# Back OUT of the app: 17-privacy failed on the Android launcher.

# Only sign in if we are not already. Home is the proof of arrival.
- runFlow:
    when:
      notVisible:
        id: "home-tile-pages"
    commands:
      # WAIT ON EITHER, AGAIN, before demanding the sign-in screen: a cold
      # relaunch has a window where neither is on screen (found by
      # 12-account, which relaunches deliberately).
      # lint: optional-ok — settles the cold-relaunch window before deciding
      # which state we are in; deciding early is the bug this replaced.
      - extendedWaitUntil:
          visible:
            id: "home-tile-pages"
          timeout: 45000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "home-tile-pages"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "sign-in-email"
                timeout: 60000
            - tapOn:
                id: "sign-in-email"
            - inputText: ${MAESTRO_QA_EMAIL}
            - tapOn:
                id: "sign-in-password"
            - inputText: ${MAESTRO_QA_PASSWORD}
            # NOT `hideKeyboard`: dismissing it relayouts the form through
            # KeyboardAvoidingView and Maestro's snapshot catches the submit
            # button mid-transition. That cost 01-ask five runs.
            - takeScreenshot: reports/01-sign-in-filled
            - tapOn:
                id: "sign-in-submit"
            # Signing in lands on HOME (`app/sign-in.tsx`, 2026-11-06).
            - extendedWaitUntil:
                visible:
                  id: "home-tile-pages"
                timeout: 60000

- assertVisible:
    id: "home-tile-pages"

# Then the assistant, the way he opens it: the tile on Home.
- tapOn:
    id: "home-tile-ai"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 30000
- assertVisible:
    id: "composer-input"
