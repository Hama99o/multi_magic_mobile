# Helper: from a signed-in app, open Notes and wait for its list or state.
# Home by its header button, never Back-until-Home: at 200 % font that loop
# backed out of the app to the launcher (2026-11-25).
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: "chat-close"
    commands:
      - tapOn:
          id: "chat-close"
- runFlow:
    when:
      visible:
        id: "header-home"
    commands:
      - tapOn:
          id: "header-home"
# At 200 % font the tile is below the fold (2026-11-25).
# Home keeps its scroll position, so the tile can be ABOVE (2026-11-25, 200 %):
# up first if it is not on screen, then down.
- runFlow:
    when:
      notVisible:
        id: "home-tile-notes"
    commands:
      - scrollUntilVisible:
          element:
            id: "home-tile-notes"
          direction: UP
          timeout: 10000
          optional: true  # lint: optional-ok — the tile may be below instead; the DOWN scroll after this is the check
- scrollUntilVisible:
    element:
      id: "home-tile-notes"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "home-tile-notes"
