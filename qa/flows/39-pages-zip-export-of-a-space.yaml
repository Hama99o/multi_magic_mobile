# M3 (parity #12): a whole space exported as a ZIP from the space's menu.
#
# COVERS: Files > QA Parity's menu > Export as ZIP > the transfer done.
# CANNOT TELL YOU: the ZIP's contents; import as a new space (by hand).
appId: ${APP_ID}
tags: [pages, parity]
---
- runFlow: login.yaml
- tapOn:
    id: "chat-close"
- tapOn:
    id: "home-tile-pages"
- tapOn:
    id: "pages-tab-files"
- extendedWaitUntil:
    visible: "QA Parity"
    timeout: 30000
- tapOn:
    id: "pages-space-more"
- tapOn:
    id: "pages-space-export"
- extendedWaitUntil:
    visible:
      id: "pages-transfer-done"
    # 5 min: the :3020 sandbox runs no job worker (its Sidekiq would also
    # start AI indexing), so multi-magic-83 runs this one export by hand when
    # pinged with the transfer id (2026-11-21).
    timeout: 300000
- takeScreenshot: reports/39-space-zip
- tapOn:
    id: "pages-transfer-close"
