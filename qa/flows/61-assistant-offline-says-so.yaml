# Readiness "Off", Assistant: `ac-readiness.sh` turns wifi and data OFF before
# this flow and back on after. The composer says it is offline.
#
# COVERS: the composer's offline state on screen.
# CANNOT TELL YOU: what happens to a question typed offline.
appId: ${APP_ID}
tags: [assistant, readiness, offline]
---
# NO login here: a relaunch with the network off leaves the dev client on its
# launcher, unable to fetch the bundle (device, 2026-11-25). The driver signs
# in ONLINE with login.yaml (it ends on the Assistant), then cuts the network.
# Offline is decided by a FAILED request, not a network listener
# (reachability.store.ts), so reopen the Assistant the way a person does: its
# GET fails, and the composer says so.
- tapOn:
    id: "chat-close"
- scrollUntilVisible:
    element:
      id: "home-tile-ai"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "home-tile-ai"
- extendedWaitUntil:
    visible:
      id: "composer-offline"
    timeout: 30000
- takeScreenshot: reports/61-assistant-offline
