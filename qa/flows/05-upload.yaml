# Attaching a file to a conversation.
#
# The picker offers `AiDocument::ALLOWED_EXTENSIONS` — nine types — and NOT what
# `Ai::FileExtractor` can read, which is wider. Offering the extractor's list
# produces a file the picker accepted and the server then 422s.
#
# The system file picker is outside the app, so this flow asserts the sheet that
# opens onto it — the three ways a person actually has a file on a phone — and
# the count against the cap. Driving the Android picker itself is a separate
# problem and a flaky one; what is ours to get right is the sheet.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: login.yaml
- tapOn:
    id: "composer-attach"
- assertVisible:
    id: "attach-sheet"
# BY HANDLE AND BY WORD, AND THE HANDLES ARE THE NEW HALF.
#
# This flow asserted only the words. `flow_lint --untouched` found that
# `attach-photo`, `attach-camera` and `attach-document` were reached by
# nothing in the suite — three controls on a screen this flow already opens.
#
# The words alone are weaker than they look for two reasons. A text assertion
# passes if the string appears ANYWHERE on screen, including in a caption that
# happens to mention it; only the handle says the CONTROL is there. And since
# `049079e` the copy is `t("attach.photo")` — a French run makes "Photo" into
# "Photo" but "Document" into "Document" and "Camera" into "Appareil photo",
# so the word assertions below hold in English and two of three would fail in
# French. The handles hold in both.
- assertVisible:
    id: "attach-photo"
- assertVisible:
    id: "attach-camera"
- assertVisible:
    id: "attach-document"
- assertVisible: "Photo"
- assertVisible: "Camera"
- assertVisible: "Document"
# "PDF or CSV" — the sheet says what it accepts rather than letting somebody
# find out at the 422.
- assertVisible: "PDF or CSV"
- takeScreenshot: reports/40-attach-sheet
- pressKey: Back
- assertVisible:
    id: "composer-input"
