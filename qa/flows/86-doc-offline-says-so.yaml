# Readiness "Off", Doc: the driver signs in ONLINE (login.yaml), then turns
# wifi and data off. A PDF picked offline must say why nothing comes.
#
# COVERS: the tool's error line with both ways out, Retry (2ddebe6) and
#   Change file, photographed; 87c takes Retry once the network is back.
# CANNOT TELL YOU: a job cut off half-way (see 88).
appId: ${APP_ID}
tags: [doc, readiness, offline]
---
- runFlow:
    file: doc-text-open.yaml
    env:
      FILE: "qa-doc.pdf"
- extendedWaitUntil:
    visible:
      id: "doc-error"
    timeout: 60000
- assertVisible:
    id: "doc-text-change"
- assertVisible:
    id: "doc-error-retry"
- takeScreenshot: reports/86-doc-offline
