# Readiness "Off", first half: `pages-parity.sh columns` turns wifi and data
# OFF before this flow. A file picked offline is queued and the bar says it
# is waiting for a connection; nothing is lost.
#
# COVERS: the queue's offline state, said on screen.
# CANNOT TELL YOU: that it sends when the network is back (flow 46 does).
appId: ${APP_ID}
tags: [pages, readiness, offline]
---
# The driver opened Trip ONLINE before cutting the network: a dev build cannot
# load its bundle offline, so relaunching here stopped at the dev launcher
# (measured 2026-11-24). This flow starts on Trip and does not relaunch.
- extendedWaitUntil:
    visible:
      id: "pages-add"
    timeout: 20000
- tapOn:
    id: "pages-add"
- tapOn:
    id: "pages-new-files"
# The system picker opens on its last place: storage root, then Download.
- extendedWaitUntil:
    visible: "sdk_gphone.*"
    timeout: 20000
- tapOn: "sdk_gphone.*"
- tapOn: "Download"
# The picker's grid puts qa-offline.txt below the fold (device, 2026-11-24).
- scrollUntilVisible:
    element: "qa-offline.txt"
    direction: DOWN
    timeout: 20000
- tapOn: "qa-offline.txt"
- extendedWaitUntil:
    visible: "Waiting for a connection"
    timeout: 60000
- takeScreenshot: reports/45-offline-waiting
