# APPEARANCE AND ACCOUNT — dark ACTUALLY on screen, and still there after a relaunch.
#
# `theme.store.ts`: *"System / Light / Dark — his instruction, alongside
# language."* `IDENTITY.md` §1 calls dark the app's own, so somebody whose phone
# is in light mode has never seen the app as designed until this control exists.
#
# ── WHAT A FLOW CAN AND CANNOT PROVE ABOUT A THEME ───────────────────────
# No assertion reads a colour. Maestro sees the accessibility tree, and a dark
# ground and a light ground have the same tree. So the proof that dark is
# VISIBLE is the pair of photographs, 66 and 68, and a person compares them —
# the same discipline as the sign-in button that had no background while every
# instrument was green (`QA_HANDBOOK.md`).
#
# What a flow CAN assert, and does: the radio is `selected` after the tap
# (`accessibilityState`), and — the store's whole reason — the choice SURVIVES
# A RELAUNCH, because `hydrate()` runs before the first paint. That second
# assertion is the one no screenshot can make.
#
# The flow starts by choosing System and ends by choosing System, so it leaves
# the device as it found it and the "before" photograph is honest on every run.
#
# ── LANGUAGE: NOT HERE, AND THAT IS THE FINDING ──────────────────────────
# The queue names a language switch. There is none in this app — nothing under
# app/ or src/ reads a locale, calls i18next or offers a language row — so this
# flow asserts nothing about it, and the register records the gap.
appId: ${APP_ID}
tags:
  - account
---
- runFlow: login.yaml

# ── Baseline: System, photographed ───────────────────────────────────────
- tapOn:
    id: "chat-open-profile"
- assertVisible:
    id: "profile-sheet"
# ONE MORE TAP THAN BEFORE, and that is the point of the change: the appearance
# choice used to sit in the CONVERSATIONS sheet, so opening a list of chats put
# a radio group for the whole app's theme in front of you. It is now behind the
# photo, under its own heading.
- tapOn:
    id: "profile-open-theme"
- assertVisible:
    id: "theme-row"
- assertVisible: "Appearance"
- tapOn:
    id: "theme-system"
- assertVisible:
    id: "theme-system"
    selected: true
- tapOn:
    id: "profile-close"
- assertVisible:
    id: "composer-input"
- takeScreenshot: reports/66-assistant-system-theme

# ── Dark ─────────────────────────────────────────────────────────────────
- tapOn:
    id: "chat-open-profile"
- tapOn:
    id: "profile-open-theme"
- tapOn:
    id: "theme-dark"
- assertVisible:
    id: "theme-dark"
    selected: true
- takeScreenshot: reports/67-sheet-dark
- tapOn:
    id: "profile-close"
- assertVisible:
    id: "composer-input"
# THE ARTEFACT. Compare with 66: if these two look the same, dark is not
# visible and nothing above this line matters.
- takeScreenshot: reports/68-assistant-dark

# ── Persisted: the choice is there after the app is launched again ───────
# `login.yaml` launches the app (and signs in only if it has to), so this is a
# real relaunch and `hydrate()` is what put the value back.
- runFlow: login.yaml
- tapOn:
    id: "chat-open-profile"
- tapOn:
    id: "profile-open-theme"
- assertVisible:
    id: "theme-dark"
    selected: true
- takeScreenshot: reports/69-dark-survived-relaunch

# ── Restored ─────────────────────────────────────────────────────────────
- tapOn:
    id: "theme-system"
- assertVisible:
    id: "theme-system"
    selected: true

# ── The Account screen: the ordinary row, and the destructive one apart ──
# Two rows and a great deal of space between them: the privacy policy in its
# own card, and the delete row at the bottom with its warning BEFORE the tap
# (Wabi's caption). Nothing here is tapped past this screen — 17-privacy and
# 18-delete-account go through the doors.
# BACK TO THE MENU FIRST — the chooser replaced it, and a pane that could only
# be left by dismissing the whole sheet would lose the place you came from.
- tapOn:
    id: "profile-back"
- tapOn:
    id: "profile-open-account"
- extendedWaitUntil:
    visible:
      id: "account-privacy"
    timeout: 30000
- assertVisible: "Account"
- assertVisible: "Privacy policy"
- assertVisible:
    id: "account-delete"
- assertVisible: "Delete account"
# `.*` because the caption gains " Not available in the app yet." whenever the
# deletion gate is shut; which state the gate is in is 18's question, not this
# flow's.
- assertVisible: "This removes everything and cannot be undone.*"
- takeScreenshot: reports/70-account
- tapOn: "Back"
- assertVisible:
    id: "composer-input"

# ── THE LANGUAGE SWITCH, AND IT IS NOT ON THIS SCREEN ────────────────────
# It sits in the SESSIONS SHEET beside the theme, under Appearance — not on
# the account screen, which is where `account/SPEC.md`'s references put
# settings. Recorded as a dated divergence note in that SPEC rather than
# moved; the theme chooser was already in the sheet and the pair belongs
# together. e7 landed it at `049079e`.
#
# ── WHAT THIS ASSERTS AND WHAT IT REFUSES TO ─────────────────────────────
# That the control exists, that both options are there, and that choosing one
# MARKS IT SELECTED — which is the app's own record of the choice, not a guess
# from what the screen happens to say. It deliberately does NOT assert that
# some other screen's words changed: that is a translation test, it belongs in
# `keys.test.ts` where every key is resolved through the real i18next
# instance, and asserting one French sentence here would prove one key rather
# than the switch.
#
# EACH LABEL STAYS IN ITS OWN LANGUAGE whichever way the app is set — English
# reads "English" and Français reads "Français" in both states — so neither
# assertion below depends on the language the flow starts in.
- tapOn:
    id: "chat-open-profile"
- tapOn:
    id: "profile-open-language"
# NO `scrollUntilVisible` ANY MORE, and its absence is the measurement. The
# language rows used to be the tail of the conversations list, so a long list
# put them below the fold and reaching them was a scroll rather than a glance —
# `99-screens` recorded that cost when it appeared. In their own pane they are
# the only thing there.
- assertVisible:
    id: "language-row"
- assertVisible:
    id: "language-en"
- assertVisible:
    id: "language-fr"
- takeScreenshot: reports/71-language-row

# French, and the app's own mark of it.
- tapOn:
    id: "language-fr"
- assertVisible:
    id: "language-fr"
    selected: true
- takeScreenshot: reports/72-language-fr

# ── AND IT PUTS ENGLISH BACK, BECAUSE THE CHOICE OUTLIVES THE RUN ────────
# It persists in AsyncStorage under `mm-language` AND on the server as
# `users.lang`, so a flow that leaves the QA account in French leaves every
# later flow asserting English copy against a French screen. Same reasoning as
# `04` deleting the conversation it creates.
- tapOn:
    id: "language-en"
- assertVisible:
    id: "language-en"
    selected: true
- tapOn:
    id: "profile-close"
- assertVisible:
    id: "composer-input"
