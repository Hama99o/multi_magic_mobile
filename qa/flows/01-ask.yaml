# THE FLOW THAT IS THE PRODUCT, and the only one that exercises the socket.
#
# `POST /api/v1/ai/show` returns 202 and the answer is broadcast later over
# ActionCable. So this asserts three separate things, in order:
#
#   1. the question is on screen IMMEDIATELY (drawn from the 202's own id);
#   2. the thinking indicator appears where the answer will go;
#   3. an answer actually ARRIVES — which no unit test can prove, because they
#      all mock the cable.
#
# If only one flow ever exists in this repo, it is this one.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: login.yaml
- takeScreenshot: reports/02-chat-before-asking

# TYPED, not tapped from the empty state. Two reasons, both learned the hard
# way: the QA account's conversation accumulates messages across runs, so the
# empty state is not there after the first pass; and the starter prompts are
# DERIVED now, so an account with nothing to derive from legitimately offers
# none. A flow that depends on either is asserting the fixture, not the product.
- tapOn:
    id: "composer-input"
- inputText: "Do I owe anyone money?"

# NO `hideKeyboard` HERE, and that one step was the whole of the mystery.
#
# Proved by bisection: after `inputText`, `composer-send` asserts VISIBLE; after
# `hideKeyboard`, the same assertion FAILS. The button is enabled either way —
# `composer-clear` renders only when the field has a value, and it is present,
# so React state updated and `canSend` is true.
#
# Dismissing the keyboard relayouts the composer through KeyboardAvoidingView,
# and Maestro's tree snapshot catches it mid-transition. "Element not found" was
# never about the selector: testID and label both failed, because the node was
# genuinely absent for that instant.
#
# A user taps send with the keyboard still up, which is also what this now does.
- tapOn:
    id: "composer-send"

# 1. The question appears before any answer exists.
#
# A short WAIT, not an instant assert: the text moves out of the composer and
# into a bubble on the next render, so an assertion fired the same millisecond
# as the tap catches neither. This is still "immediately" in the sense that
# matters — it is drawn from the 202's own id, long before any answer.
- extendedWaitUntil:
    visible: "Do I owe anyone money?"
    timeout: 20000
- takeScreenshot: reports/03-question-posted

# 2. Dots where the answer will be — OPTIONAL, and honestly so.
#
# The indicator is load-bearing in the product and a race in a flow: on a fast
# turn the answer can land before the assertion runs, and failing then would
# report a bug for the app being quick. Its behaviour is covered by unit test
# (it appears on pending, and its 45-second copy change); what this flow is for
# is the ANSWER ARRIVING, which is the assertion below and cannot be raced.
- assertVisible:
    id: "thinking"
    optional: true

# 3. The answer lands. Generous, because a RAG turn plus a provider call is
#    genuinely slow — but far short of the composer's own 3-minute release, so
#    a timeout here means "it did not arrive", not "we were impatient".
- extendedWaitUntil:
    notVisible:
      id: "thinking"
    timeout: 120000
- assertVisible:
    id: "assistant-answer"
- takeScreenshot: reports/04-answer-arrived
